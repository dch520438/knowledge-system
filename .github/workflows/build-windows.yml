name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyinstaller-hooks-contrib
          pip install -r backend/requirements.txt

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
          cd ..
          if (Test-Path backend/static) { Remove-Item -Recurse -Force backend/static }
          Copy-Item -Recurse frontend/dist backend/static
          Test-Path backend/static/index.html

      - name: Build EXE with PyInstaller
        run: |
          cd build-scripts/windows
          python -m PyInstaller --clean --noconfirm KnowledgeWorkstation.spec

      - name: Verify build output
        run: |
          Test-Path build-scripts/windows/dist/KnowledgeWorkstation.exe
          Get-ChildItem build-scripts/windows/dist/

      - name: Copy templates to dist
        run: |
          if (Test-Path templates) {
            Copy-Item -Recurse templates build-scripts/windows/dist/
          }

      - name: Create ZIP artifact
        run: |
          cd build-scripts/windows/dist
          Compress-Archive -Path * -DestinationPath "$env:GITHUB_WORKSPACE/KnowledgeWorkstation-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnowledgeWorkstation-Windows
          path: build-scripts/windows/dist/

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: KnowledgeWorkstation-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
