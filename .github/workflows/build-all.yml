name: Build All Platforms

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyinstaller-hooks-contrib
          pip install -r backend/requirements.txt

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
          cd ..
          if (Test-Path backend/static) { Remove-Item -Recurse -Force backend/static }
          Copy-Item -Recurse frontend/dist backend/static
          Test-Path backend/static/index.html

      - name: Build EXE with PyInstaller
        run: |
          cd build-scripts/windows
          python -m PyInstaller --clean --noconfirm KnowledgeWorkstation.spec

      - name: Verify build output
        run: |
          Test-Path build-scripts/windows/dist/KnowledgeWorkstation.exe
          Get-ChildItem build-scripts/windows/dist/

      - name: Copy templates to dist
        run: |
          if (Test-Path templates) {
            Copy-Item -Recurse templates build-scripts/windows/dist/
          }

      - name: Create ZIP artifact
        run: |
          cd build-scripts/windows/dist
          Compress-Archive -Path * -DestinationPath "$env:GITHUB_WORKSPACE/KnowledgeWorkstation-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnowledgeWorkstation-Windows
          path: build-scripts/windows/dist/

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          pip install --upgrade pip
          pip install pyinstaller
          pip install -r backend/requirements.txt
          cd frontend
          npm install
          npm run build
          cd ..
          rm -rf backend/static
          cp -r frontend/dist backend/static
          ls -la backend/static/
          test -f backend/static/index.html

      - name: Build deb package
        run: |
          set -e
          VERSION="1.0.0"
          ARCH="amd64"
          BUILD_DIR="build-scripts/kylin/build"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          DEB_DIR="$BUILD_DIR/knowledge-workstation_${VERSION}_${ARCH}"
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/opt/knowledge-workstation"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/bin"

          cp -r backend "$DEB_DIR/opt/knowledge-workstation/"
          cp -r templates "$DEB_DIR/opt/knowledge-workstation/" 2>/dev/null || true
          cp start.sh "$DEB_DIR/opt/knowledge-workstation/"

          cat > "$DEB_DIR/usr/bin/knowledge-workstation" << 'EOF'
          #!/bin/bash
          cd /opt/knowledge-workstation
          exec ./start.sh "$@"
          EOF
          chmod +x "$DEB_DIR/usr/bin/knowledge-workstation"

          cat > "$DEB_DIR/usr/share/applications/knowledge-workstation.desktop" << 'EOF'
          [Desktop Entry]
          Name=智能知识工作台
          Name[zh_CN]=智能知识工作台
          Comment=集成知识库管理、智能写作、核稿检查、智能问答的综合工作平台
          Exec=/usr/bin/knowledge-workstation
          Icon=knowledge-workstation
          Type=Application
          Categories=Office;Education;
          Terminal=false
          StartupNotify=true
          EOF

          cat > "$DEB_DIR/DEBIAN/control" << EOF
          Package: knowledge-workstation
          Version: $VERSION
          Section: office
          Priority: optional
          Architecture: $ARCH
          Depends: python3 (>= 3.8), python3-pip
          Maintainer: Knowledge Workstation Team
          Description: 智能知识工作台
           集成知识库管理、智能写作、核稿检查、
           智能问答和大模型辅助的综合工作平台。
          EOF

          cat > "$DEB_DIR/DEBIAN/postinst" << 'EOF'
          #!/bin/bash
          set -e
          cd /opt/knowledge-workstation/backend
          pip3 install -r requirements.txt --break-system-packages -q 2>/dev/null || pip3 install -r requirements.txt -q 2>/dev/null || true
          mkdir -p /opt/knowledge-workstation/backend/data
          chmod 755 /opt/knowledge-workstation/backend/data
          EOF
          chmod +x "$DEB_DIR/DEBIAN/postinst"

          cat > "$DEB_DIR/DEBIAN/prerm" << 'EOF'
          #!/bin/bash
          set -e
          pkill -f "uvicorn main:app" 2>/dev/null || true
          EOF
          chmod +x "$DEB_DIR/DEBIAN/prerm"

          dpkg-deb --build "$DEB_DIR"
          echo "deb package built:"
          ls -la "$BUILD_DIR/"*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnowledgeWorkstation-Linux
          path: build-scripts/kylin/build/*.deb

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Create Android project
        run: |
          set -e
          SCRIPT_DIR="$PWD/build-scripts/android"
          PROJECT_DIR="$PWD/android-project"
          mkdir -p "$PROJECT_DIR/app/src/main/java/com/knowledgeworkstation/app"
          mkdir -p "$PROJECT_DIR/app/src/main/res/layout"
          mkdir -p "$PROJECT_DIR/app/src/main/res/values"
          mkdir -p "$PROJECT_DIR/app/src/main/res/mipmap-hdpi"

          cp "$SCRIPT_DIR/build.gradle.kts" "$PROJECT_DIR/app/build.gradle.kts"
          cp "$SCRIPT_DIR/AndroidManifest.xml" "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          cp "$SCRIPT_DIR/MainActivity.java" "$PROJECT_DIR/app/src/main/java/com/knowledgeworkstation/app/MainActivity.java"
          cp "$SCRIPT_DIR/activity_main.xml" "$PROJECT_DIR/app/src/main/res/layout/activity_main.xml"
          cp "$SCRIPT_DIR/strings.xml" "$PROJECT_DIR/app/src/main/res/values/strings.xml"

          cat > "$PROJECT_DIR/app/src/main/res/values/themes.xml" << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.KnowledgeWorkstation" parent="Theme.AppCompat.Light.DarkActionBar">
              </style>
          </resources>
          XMLEOF

          touch "$PROJECT_DIR/app/proguard-rules.pro"

          cat > "$PROJECT_DIR/build.gradle.kts" << 'EOF'
          plugins {
              id("com.android.application") version "8.2.0" apply false
          }
          EOF

          cat > "$PROJECT_DIR/settings.gradle.kts" << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KnowledgeWorkstation"
          include(":app")
          EOF

          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.2

      - name: Build APK
        run: |
          cd android-project
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        run: |
          ls -la android-project/app/build/outputs/apk/release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnowledgeWorkstation-Android
          path: android-project/app/build/outputs/apk/release/*.apk

  release:
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/KnowledgeWorkstation-Windows/*.zip
            artifacts/KnowledgeWorkstation-Linux/*.deb
            artifacts/KnowledgeWorkstation-Android/*.apk
          body: |
            ## 智能知识工作台 ${{ github.ref_name }}

            ### 安装包下载

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | Windows | `KnowledgeWorkstation-Windows.zip` | 解压后运行 `.exe` |
            | Linux (deb) | `knowledge-workstation_1.0.0_amd64.deb` | `sudo dpkg -i` 安装 |
            | Android | `app-release-unsigned.apk` | 安装后连接服务器使用 |

            ### 快速开始

            **Windows**: 解压 ZIP，双击 `KnowledgeWorkstation.exe`

            **Linux**: `sudo dpkg -i knowledge-workstation_1.0.0_amd64.deb && knowledge-workstation`

            **Android**: 安装 APK 后，修改服务器地址指向后端服务
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
