name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Create Android project
        run: |
          set -e
          SCRIPT_DIR="$PWD/build-scripts/android"
          PROJECT_DIR="$PWD/android-project"
          mkdir -p "$PROJECT_DIR/app/src/main/java/com/knowledgeworkstation/app"
          mkdir -p "$PROJECT_DIR/app/src/main/res/layout"
          mkdir -p "$PROJECT_DIR/app/src/main/res/values"
          mkdir -p "$PROJECT_DIR/app/src/main/res/mipmap-hdpi"

          cp "$SCRIPT_DIR/build.gradle.kts" "$PROJECT_DIR/app/build.gradle.kts"
          cp "$SCRIPT_DIR/AndroidManifest.xml" "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          cp "$SCRIPT_DIR/MainActivity.java" "$PROJECT_DIR/app/src/main/java/com/knowledgeworkstation/app/MainActivity.java"
          cp "$SCRIPT_DIR/activity_main.xml" "$PROJECT_DIR/app/src/main/res/layout/activity_main.xml"
          cp "$SCRIPT_DIR/strings.xml" "$PROJECT_DIR/app/src/main/res/values/strings.xml"

          cat > "$PROJECT_DIR/app/src/main/res/values/themes.xml" << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.KnowledgeWorkstation" parent="Theme.AppCompat.Light.DarkActionBar">
              </style>
          </resources>
          XMLEOF

          touch "$PROJECT_DIR/app/proguard-rules.pro"

          cat > "$PROJECT_DIR/build.gradle.kts" << 'EOF'
          plugins {
              id("com.android.application") version "8.2.0" apply false
          }
          EOF

          cat > "$PROJECT_DIR/settings.gradle.kts" << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KnowledgeWorkstation"
          include(":app")
          EOF

          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.2

      - name: Build APK
        run: |
          cd android-project
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        run: |
          ls -la android-project/app/build/outputs/apk/release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnowledgeWorkstation-Android
          path: android-project/app/build/outputs/apk/release/*.apk

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: android-project/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
